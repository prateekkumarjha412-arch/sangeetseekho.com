<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sangeet Seekho — Coming Soon</title>
  <meta name="description" content="Sangeet Seekho — learn music. Our website is coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #faf9f7;
      --fg: #141414;
      --muted: #6b6b6b;
      --line: #e4e2de;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111111;
        --fg: #f2f2f0;
        --muted: #9a9a96;
        --line: #2a2a2a;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    header .mark { font-weight: 800; color: var(--fg); letter-spacing: -0.01em; }
    header .domain { font-weight: 400; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 0;
    }
    .label {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 800;
      font-size: clamp(52px, 12vw, 128px);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    h1 span { display: block; font-weight: 200; }
    .tagline {
      font-weight: 300;
      font-size: clamp(22px, 3.6vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-top: 32px;
      max-width: 22ch;
    }
    .tagline strong { font-weight: 600; }
    .rule {
      height: 1px;
      width: 120px;
      background: var(--line);
      margin: 40px 0 20px;
    }
    .note {
      font-weight: 400;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 44ch;
    }
    footer { font-weight: 300; }

    /* Sound wave loader */
    .wave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 44px;
      margin-bottom: 28px;
    }
    .wave span {
      width: 4px;
      height: 100%;
      border-radius: 2px;
      background: var(--fg);
      transform: scaleY(0.2);
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(1)  { animation-delay: -1.10s; }
    .wave span:nth-child(2)  { animation-delay: -0.95s; }
    .wave span:nth-child(3)  { animation-delay: -0.80s; }
    .wave span:nth-child(4)  { animation-delay: -0.65s; }
    .wave span:nth-child(5)  { animation-delay: -0.50s; }
    .wave span:nth-child(6)  { animation-delay: -0.35s; }
    .wave span:nth-child(7)  { animation-delay: -0.20s; }
    .wave span:nth-child(8)  { animation-delay: -0.05s; }
    .wave span:nth-child(9)  { animation-delay: -0.90s; }
    .wave span:nth-child(10) { animation-delay: -0.60s; }
    .wave span:nth-child(11) { animation-delay: -0.30s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.2); opacity: 0.35; }
      50%      { transform: scaleY(1);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave span { animation: none; transform: scaleY(0.5); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <header>
    <span class="mark">SS</span>
    <span class="domain">sangeetseekho.com</span>
  </header>

  <main>
    <div class="wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="label">Coming soon</p>
    <h1>Sangeet <span>Seekho</span></h1>
    <p class="tagline">A simpler way to <strong>learn music</strong>, one note at a time.</p>
    <div class="rule"></div>
    <p class="note">We're tuning things up. Our new website will be live shortly.</p>
  </main>

  <footer>
    <span>&copy; <span id="y">2026</span> Sangeet Seekho</span>
    <span>Launching soon</span>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
