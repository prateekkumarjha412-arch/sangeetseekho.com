<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sangeet Seekho — Coming Soon</title>
  <meta name="description" content="Sangeet Seekho — learn music. Our website is coming soon.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff8f0;
      --fg: #1c1426;
      --muted: #6e6275;
      --saffron: #f08a24;
      --rose: #e0457b;
      --indigo: #5b3fd1;
      --glow-a: rgba(240, 138, 36, 0.16);
      --glow-b: rgba(91, 63, 209, 0.12);
      --grad: linear-gradient(90deg, var(--saffron), var(--rose) 50%, var(--indigo));
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #140f1c;
        --fg: #f7f1ea;
        --muted: #a99db3;
        --saffron: #ffa24a;
        --rose: #ff6b9a;
        --indigo: #9682ff;
        --glow-a: rgba(255, 162, 74, 0.12);
        --glow-b: rgba(150, 130, 255, 0.14);
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background:
        radial-gradient(60vw 60vw at 100% 0%, var(--glow-b), transparent 70%),
        radial-gradient(60vw 60vw at 0% 100%, var(--glow-a), transparent 70%),
        var(--bg);
      color: var(--fg);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      padding: 32px 24px;
      -webkit-font-smoothing: antialiased;
    }
    header, footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 13px;
      color: var(--muted);
    }
    header .mark { font-weight: 800; color: var(--saffron); letter-spacing: -0.01em; }
    header .domain { font-weight: 400; }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 48px 0;
    }
    .label {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 24px;
    }
    h1 {
      font-weight: 800;
      font-size: clamp(52px, 12vw, 128px);
      line-height: 0.95;
      letter-spacing: -0.045em;
    }
    h1 span {
      display: block;
      font-weight: 200;
      background: var(--grad);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      padding-bottom: 0.08em;
    }
    .tagline {
      font-weight: 300;
      font-size: clamp(22px, 3.6vw, 34px);
      line-height: 1.25;
      letter-spacing: -0.015em;
      margin-top: 32px;
      max-width: 22ch;
    }
    .tagline strong { font-weight: 600; color: var(--indigo); }
    .rule {
      height: 2px;
      width: 120px;
      border-radius: 1px;
      background: var(--grad);
      margin: 40px 0 20px;
    }
    .note {
      font-weight: 400;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
      max-width: 44ch;
    }
    footer { font-weight: 300; }

    /* Sound wave loader */
    .wave {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 44px;
      margin-bottom: 28px;
    }
    .wave span {
      width: 4px;
      height: 100%;
      border-radius: 2px;
      background: var(--grad);
      background-size: 95px 100%; /* 11 bars × 9px step → one continuous gradient */
      transform: scaleY(0.2);
      animation: wave 1.2s ease-in-out infinite;
    }
    .wave span:nth-child(2)  { background-position: -9px 0; }
    .wave span:nth-child(3)  { background-position: -18px 0; }
    .wave span:nth-child(4)  { background-position: -27px 0; }
    .wave span:nth-child(5)  { background-position: -36px 0; }
    .wave span:nth-child(6)  { background-position: -45px 0; }
    .wave span:nth-child(7)  { background-position: -54px 0; }
    .wave span:nth-child(8)  { background-position: -63px 0; }
    .wave span:nth-child(9)  { background-position: -72px 0; }
    .wave span:nth-child(10) { background-position: -81px 0; }
    .wave span:nth-child(11) { background-position: -90px 0; }
    .wave span:nth-child(1)  { animation-delay: -1.10s; }
    .wave span:nth-child(2)  { animation-delay: -0.95s; }
    .wave span:nth-child(3)  { animation-delay: -0.80s; }
    .wave span:nth-child(4)  { animation-delay: -0.65s; }
    .wave span:nth-child(5)  { animation-delay: -0.50s; }
    .wave span:nth-child(6)  { animation-delay: -0.35s; }
    .wave span:nth-child(7)  { animation-delay: -0.20s; }
    .wave span:nth-child(8)  { animation-delay: -0.05s; }
    .wave span:nth-child(9)  { animation-delay: -0.90s; }
    .wave span:nth-child(10) { animation-delay: -0.60s; }
    .wave span:nth-child(11) { animation-delay: -0.30s; }
    @keyframes wave {
      0%, 100% { transform: scaleY(0.2); opacity: 0.35; }
      50%      { transform: scaleY(1);   opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .wave span { animation: none; transform: scaleY(0.5); opacity: 0.6; }
    }
  </style>
</head>
<body>
  <header>
    <span class="mark">SS</span>
    <span class="domain">sangeetseekho.com</span>
  </header>

  <main>
    <div class="wave" aria-hidden="true">
      <span></span><span></span><span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="label">Coming soon</p>
    <h1>Sangeet <span>Seekho</span></h1>
    <p class="tagline">A simpler way to <strong>learn music</strong>, one note at a time.</p>
    <div class="rule"></div>
    <p class="note">We're tuning things up. Our new website will be live shortly.</p>
  </main>

  <footer>
    <span>&copy; <span id="y">2026</span> Sangeet Seekho</span>
    <span>Launching soon</span>
  </footer>

  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
